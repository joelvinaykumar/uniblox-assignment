services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uniblox_assignment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uniblox_assignment"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  database-setup:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@database:5432/uniblox_assignment
    command: ["node", "scripts/run-sql.js"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the shell}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@database:5432/uniblox_assignment
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
      database-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
